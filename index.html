<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      // Immediate theme initialization script to prevent initial light-theme flicker
      (function() {
        try {
          const isDark = localStorage.getItem('prism_theme_mode') === 'dark' || 
            (!('prism_theme_mode' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {}
      })();
    </script>
    <title>Prism — Retail Investor Super App</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Prism" />
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/192/triangle.png" />
    <!-- Google Fonts: Fraunces (display serif) & Poppins (geometric sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: 'Poppins', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
    </style>
  </head>
  <body class="bg-[#FAF9F6] dark:bg-[#090D16] text-[#0F172A] dark:text-slate-100 antialiased selection:bg-blue-100 select-none transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Force unregister any existing service worker and clear all cache storage
      // to prevent cached stale bundle assets (blank white screen issues in preview)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (let registration of registrations) {
            registration.unregister().then((success) => {
              if (success) {
                console.log('[Prism ServiceWorker] Unregistered successfully.');
              }
            });
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then((names) => {
          for (let name of names) {
            caches.delete(name).then(() => {
              console.log('[Prism Cache] Cleared:', name);
            });
          }
        });
      }
    </script>
  </body>
</html>
